[build-system]
requires = [
    "setuptools==84.2.1",
    "setuptools_scm==10.3.4",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "pyspamsum"
description = "A Python wrapper for Andrew Tridgell's spamsum algorithm"
readme = "README.md"
requires-python = ">= 3.11"
authors = [
    {name="Russell Keith-Magee", email="russell@keith-magee.com"}
]
maintainers = [
    {name="Russell Keith-Magee", email="russell@keith-magee.com"}
]
keywords = [
    "spamsum",
]
license = "BSD-3-Clause AND Artistic-1.0-Perl"
license-files = ["LICENSE", "LICENSE.spamsum"]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[dependency-groups]
# Extras used by developers *of* briefcase are pinned to specific versions to
# ensure environment consistency.
pre-commit = [
    "pre-commit == 4.7.0",
]
test = [
    "pytest == 9.2.0",
]
ci = [
    "setuptools_scm == 10.3.4",
    "tox-uv == 1.37.5",
]
dev = [
    {include-group = "cibuildwheel"},
    {include-group = "pre-commit"},
    {include-group = "test"},
]

[project.urls]
Homepage = "https://github.com/freakboy3742/pyspamsum/"
Tracker = "https://github.com/freakboy3742/pyspamsum/issues"
Source = "https://github.com/freakboy3742/pyspamsum/"

[tool.cibuildwheel]
test-command = "python -m pytest -vv"
test-groups = ["test"]
test-sources = ["tests"]
xbuild-tools = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.ruff.lint]
# In addition to the default rules, these additional rules will be used:
extend-select = [
    "E",      # pycodestyle
    "W",      # pycodestyle
    "F",      # pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "C4",     # flake8-comprehensions
    "I",      # isort
    # The SIM rules are *very* opinionated, and don't necessarily make for better code.
    # They may be worth occasionally turning on just to see if something could actually
    # use improvement.
    # "SIM",    # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["spamsum"]

[tool.rumdl]
exclude = [".github/*.md"]
respect-gitignore = true

# MD007: List leading spaces - CoC nested lists only render on both GitHub and website with 5 spaces.
# MD033: No inline HTML - Used for header anchors.
[tool.rumdl.per-file-ignores]
"CODE_OF_CONDUCT.md" = ["MD007", "MD033"]
"AI_POLICY.md" = ["MD033"]

[tool.rumdl.MD013]  # Line length
line_length = 999999
reflow = true
reflow_mode = "normalize"

[tool.rumdl.MD026]  # Remove punctuation at the end of headings
punctuation = ",;:"

[tool.setuptools]
ext-modules = [
    {name="spamsum", sources=["src/pyspamsum.c", "src/spamsum.c", "src/edit_dist.c"]},
]

[tool.setuptools_scm]
# To enable SCM versioning, we need an empty tool configuration for setuptools_scm
